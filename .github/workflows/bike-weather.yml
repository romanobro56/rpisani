name: Bike weather reminder

on:
  schedule:
    - cron: '0 12 * * *'
      timezone: America/New_York
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run checks the forecast; test sends one clearly labeled email'
        type: choice
        options:
          - dry-run
          - test
        default: dry-run

permissions:
  contents: read

concurrency:
  group: bike-weather
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Test reminder logic
        run: python -m unittest discover -s automation -p 'test_*.py'
      - name: Check forecast and remind if needed
        env:
          REMINDER_MODE: ${{ github.event_name == 'schedule' && 'scheduled' || inputs.mode }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BIKE_EMAIL_TO: ${{ secrets.BIKE_EMAIL_TO }}
          BIKE_EMAIL_FROM: ${{ secrets.BIKE_EMAIL_FROM }}
          WEATHER_LATITUDE: ${{ secrets.WEATHER_LATITUDE }}
          WEATHER_LONGITUDE: ${{ secrets.WEATHER_LONGITUDE }}
          WEATHER_LOCATION: ${{ secrets.WEATHER_LOCATION }}
        run: python automation/bike_weather.py
